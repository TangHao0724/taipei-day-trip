<!DOCTYPE html>
<html lang="en">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/booking.css">

  <script src="/static/scripts/member.js" defer></script>
</head>
<body>
  <div id="black-drop" class="drop-display black-drop"></div>
  <nav class="bg-add-c-w">
    <script src="/static/scripts/nav.js" defer></script>
    <div>
      <button id="nav-title" class="dialog-btn bg-add-c-w body sec-c-70">
        <H2 class=" headline pri-c-70">
          台北一日遊
        </H2>
      </button>
      <menu>
        <dt class="body sec-c-70">
          <button  id="booking-btn" class="dialog-btn bg-add-c-w body sec-c-70">
            預定行程
          </button>
        </dt>
        <dt >
          <button id="dialog-btn" class="dialog-btn bg-add-c-w body sec-c-70">
          </button>
        </dt>
      </menu>
    </div>
  </nav>
  
  <main>
    <section class="booking-title">
      <span id="title" class="button-b sec-c-70">
      </span>
    </section>
    <div class="hr"></div>
    <section class="booking-item">
        <span class="block-title button-b sec-c-70">AI工具整合</span>
        <div class="block">
          <div class="block-item">
              <span class="notice body-b pri-c-70">MCP詳細設定：</span>
          </div>
          <div class="block-item">
              <span class="title body-b sec-c-70">Host URL：</span>
          </div>
          <div class="block-item">
              <span  id="mcp-url" class="title body sec-c-70"></span>
          </div>
          <div class="block-item">
              <span class="title body-b sec-c-70">Bearer Token：</span>
          </div>
          <div class="block-item">
              <span id="token" class="title body sec-c-70"></span>
          </div>
          <div class="block-item">
              <button id="token-btn" class="send-btn bg-pri-c-70 button add-c-w">產生/更新密鑰</button>
          </div>
        </div>
    </section>
    <div class="hr"></div>
    <section class="booking-item">
        <button id="signout-btn" class="send-btn bg-pri-c-70 button add-c-w">登出會員</button>
    </section>
    
  </main>
  <footer class="bg-sec-c-50 footerbar">
    <p class="body-b add-c-w">
      COPYRIGHT © 2021 台北一日遊
    </p>
  </footer>
</body>
</html>
